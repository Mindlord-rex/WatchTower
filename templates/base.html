<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WatchTower - Surveillance Video Intelligence{% endblock %}</title>
    <!-- Tailwind CSS (Pure CSS CDN, zero JavaScript) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <!-- WatchTower Custom Dark Theme Stylesheet -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <!-- HTMX Library for dynamic server-rendered HTML interactions -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col min-h-screen">
    <!-- Top Navigation Bar -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Brand -->
                <div class="flex items-center space-x-3">
                    <a href="/" class="flex items-center space-x-3 text-white font-bold text-xl tracking-wider hover:text-cyan-400">
                        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                            <!-- Camera / Eye icon in SVG -->
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <span>WATCH<span class="text-cyan-400">TOWER</span></span>
                    </a>
                    <span class="hidden md:inline-block px-2.5 py-0.5 text-xs font-semibold rounded-full bg-gray-800 text-cyan-400 border border-gray-700">
                        Surveillance AI
                    </span>
                </div>

                <!-- Navigation Links -->
                <nav class="flex items-center space-x-1 sm:space-x-4">
                    <a href="/" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'dashboard' %}bg-gray-800 text-white border-b-2 border-cyan-400{% else %}text-gray-300 hover:bg-gray-800 hover:text-white{% endif %}">
                        Dashboard
                    </a>
                    <a href="/search" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'search' %}bg-gray-800 text-white border-b-2 border-cyan-400{% else %}text-gray-300 hover:bg-gray-800 hover:text-white{% endif %}">
                        Semantic Search
                    </a>
                    <a href="/upload" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'upload' %}bg-gray-800 text-white border-b-2 border-cyan-400{% else %}text-gray-300 hover:bg-gray-800 hover:text-white{% endif %}">
                        Upload Video
                    </a>
                    <a href="/library" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'library' %}bg-gray-800 text-white border-b-2 border-cyan-400{% else %}text-gray-300 hover:bg-gray-800 hover:text-white{% endif %}">
                        Video Library
                    </a>
                </nav>

                <!-- Hardware & Model Status Badge -->
                <div class="hidden lg:flex items-center space-x-3 text-xs text-gray-400">
                    <div class="flex items-center space-x-1.5 px-2.5 py-1 rounded bg-gray-800/80 border border-gray-700">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="font-mono text-gray-300">YOLOv8 + CLIP</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between">
            <p>WatchTower &mdash; Video Intelligence & Semantic Person Search</p>
            <p class="mt-2 sm:mt-0 font-mono text-gray-400">Pure Server-Rendered HTML &bull; HTMX Powered &bull; No JS</p>
        </div>
    </footer>
</body>
</html>
